name: Publish

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # A tag publishes a release under the tag's version; a manual run publishes the snapshot
      # version from gradle.properties. Without this the tag would republish that snapshot.
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is not a semantic version"
              exit 1
            fi
            if [[ "${version}" == *-SNAPSHOT ]]; then
              echo "::error::Refusing to publish a snapshot from a tag"
              exit 1
            fi
            echo "gradle-args=-PVERSION_NAME=${version}" >> "$GITHUB_OUTPUT"
            echo "Publishing release ${version}"
          else
            echo "gradle-args=" >> "$GITHUB_OUTPUT"
            echo "Publishing the snapshot from gradle.properties"
          fi

      - name: Verify before publishing
        run: ./gradlew build ${{ steps.version.outputs.gradle-args }} --stacktrace

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral ${{ steps.version.outputs.gradle-args }} --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
