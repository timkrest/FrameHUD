name: Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The tag is the only source of a released version; VERSION_NAME in gradle.properties stays a
      # snapshot so that a local build is never mistaken for a release.
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a semantic version"
            exit 1
          fi
          if [[ "${version}" == *-SNAPSHOT ]]; then
            echo "::error::Refusing to publish a snapshot"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version}"

      - name: Verify before publishing
        run: ./gradlew build -PVERSION_NAME=${{ steps.version.outputs.version }} --stacktrace

      # Uploads a deployment to the Central Portal, which waits to be released by hand.
      - name: Publish to Maven Central
        run: >
          ./gradlew publishToMavenCentral
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md)
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "FrameHUD ${VERSION}" \
            --notes "${notes:-See CHANGELOG.md}"
